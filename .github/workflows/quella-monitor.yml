name: Quella Chatbot Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Quella QA Monitor
        run: npx playwright test

      - name: Upload Reports on Failure or Completion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quella-monitor-reports
          path: |
            reports/
            playwright-report/
          retention-days: 7
